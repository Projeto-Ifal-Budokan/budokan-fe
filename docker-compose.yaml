services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NODE_ENV=production
    container_name: frontend-budokanryu
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    # Sem publicar porta: o SWAG chega ate aqui pela rede swag_default.
    # A porta 3000 ja esta ocupada por outro projeto nesta maquina.
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          # 127.0.0.1, nao localhost: o Next escuta em 0.0.0.0 (IPv4) e o wget do
          # alpine resolve "localhost" para [::1], o que dava connection refused.
          'http://127.0.0.1:3000/',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    #       cpus: '0.5'
    #     reservations:
    #       memory: 512M
    #       cpus: '0.5'
    networks:
      # alias unico: o nome do servico ("app") viraria alias na rede compartilhada
      # e colidiria com o "app" de outros projetos
      swag_default:
        aliases:
          - budokan-fe

networks:
  swag_default:
    external: true
